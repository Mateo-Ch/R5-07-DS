name: Q2 Archive XYZ

on:
  workflow_dispatch:
  push:
    paths:
      - 'XYZ.txt'

permissions:
  contents: write

jobs:
  archive-xyz-q2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate Q2_archive_XYZ.txt
        run: |
          if [ ! -f "XYZ.txt" ]; then
            echo "Erreur : XYZ.txt est introuvable à la racine du dépôt."
            exit 1
          fi

          NOM_PRENOM="Mateo CHEVEAU"
          DATE_EXECUTION="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          TAILLE_OCTETS="$(stat -c%s "XYZ.txt")"

          {
            echo "Nom et prénom : ${NOM_PRENOM}"
            echo "Date et heure d'exécution : ${DATE_EXECUTION}"
            echo "Taille de XYZ.txt : ${TAILLE_OCTETS} octets"
            echo "--- Contenu de XYZ.txt ---"
            cat "XYZ.txt"
          } > Q2_archive_XYZ.txt

      - name: Commit and push Q2_archive_XYZ.txt
        run: |
          git config user.name "Mateo-Ch"
          git config user.email "mateocheveau2109@gmail.com"
          git add Q2_archive_XYZ.txt
          if git diff --staged --quiet; then
            echo "Aucun changement à pousser."
            exit 0
          fi
          git commit -m "chore: create Q2_archive_XYZ.txt"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
